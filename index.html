<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rudimental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0f0f12;
  --s1:#1a1a1f;
  --s2:#222228;
  --s3:#2a2a32;
  --border:#2e2e3a;
  --text:#e8e4d9;
  --muted:#888;
  --dim:#4a4a55;
  --gold:#e8b86d;
  --gold-bg:rgba(232,184,109,0.10);
  --blue:#7eb8c8;
  --blue-bg:rgba(126,184,200,0.10);
  --red:#e07878;
  --red-bg:rgba(224,120,120,0.13);
  --green:#7ec8a0;
  --green-bg:rgba(126,200,160,0.10);
  --purple:#b388ff;
  --purple-bg:rgba(179,136,255,0.12);
  --emerald:#80cb74;
  --emerald-bg:rgba(128,203,116,0.14);
  --sans:'Lato',sans-serif;
  --serif:'Playfair Display',serif;
  --r:10px;
}

html,body{height:100%;overflow:hidden}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  height:100vh;
}

::-webkit-scrollbar{width:3px;height:3px;background:transparent}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:3px}

/* ── HEADER ── */
.header{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 10px;
  background:var(--s1);
  border-bottom:1px solid var(--border);
}
.logo{font-family:var(--serif);font-size:17px;color:var(--text);line-height:1}
.logo em{color:var(--gold);font-style:normal}
.bpm-header{display:flex;align-items:baseline;gap:4px}
.bpm-num{font-family:var(--serif);font-size:22px;color:var(--gold);line-height:1}
.bpm-unit{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}

/* ── TABS ── */
.tabs{
  flex-shrink:0;
  display:flex;gap:6px;
  padding:10px 14px 8px;
  background:var(--s1);
  border-bottom:1px solid var(--border);
  overflow-x:auto;
}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{
  flex-shrink:0;
  padding:5px 14px;
  border-radius:20px;
  border:1.5px solid var(--border);
  background:transparent;
  color:var(--muted);
  font-size:12px;font-weight:600;
  cursor:pointer;transition:all 0.15s;
  font-family:var(--sans);
}
.tab-btn:hover{border-color:var(--gold);color:var(--gold)}
.tab-btn.active{background:var(--gold);border-color:var(--gold);color:#111}

/* ── BODY ── */
.body{
  flex:1;
  display:grid;
  grid-template-columns:200px 1fr;
  min-height:0;
  overflow:hidden;
}

/* ── RUDIMENT LIST ── */
.rud-list{
  border-right:1px solid var(--border);
  overflow-y:auto;
  background:var(--s1);
}
.rud-group{border-bottom:1px solid var(--border)}
.rud-group-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;
  cursor:pointer;
  background:var(--bg);
  position:sticky;top:0;z-index:1;
  user-select:none;
}
.rud-group-header:hover{background:#141418}
.rud-group-label{
  display:flex;align-items:center;gap:7px;
  font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;
}
.g-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.rud-group-arrow{font-size:10px;color:var(--dim);transition:transform 0.2s}
.rud-group-arrow.open{transform:rotate(180deg)}
.rud-items{display:none}
.rud-items.open{display:block}
.rud-row{
  padding:7px 12px 7px 20px;
  cursor:pointer;
  font-size:12px;color:var(--muted);
  border-bottom:1px solid rgba(255,255,255,0.03);
  transition:all 0.12s;
  display:flex;align-items:center;gap:7px;
}
.rud-row:hover{background:var(--s2);color:var(--text)}
.rud-row.active{color:var(--gold);background:var(--gold-bg)}
.rud-row-num{font-size:9px;color:var(--dim);min-width:14px}

/* ── PANEL ── */
.panel{
  display:flex;flex-direction:column;
  overflow:hidden;
  padding:14px 16px;
  gap:12px;
}

.rud-header{flex-shrink:0}
.rud-name{font-family:var(--serif);font-size:20px;font-weight:400;line-height:1.1}
.rud-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:8px}
.cat-pill{padding:2px 8px;border-radius:10px;font-size:9px;letter-spacing:1px;font-weight:700}

/* sequence */
.seq-wrap{
  flex-shrink:0;
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:10px 12px;
}
.seq-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.seq-row{display:flex;flex-wrap:wrap;gap:4px}
.sq{
  width:30px;height:30px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
  border:1px solid var(--border);background:var(--s2);
  transition:all 0.07s;
}
.sq.D{color:var(--blue)}
.sq.I{color:var(--red)}
.sq.K{color:var(--purple)}
.sq.H{color:var(--emerald)}
.sq.g{color:var(--gold);font-size:9px;border-style:dashed}
.sq.active{transform:scale(1.15);border-color:currentColor;background:rgba(255,255,255,0.07)}
.sq.active.D{background:var(--blue-bg)}
.sq.active.I{background:var(--red-bg)}
.sq.active.K{background:var(--purple-bg)}
.sq.active.H{background:var(--emerald-bg)}

/* practice */
.practice{
  flex-shrink:0;
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:12px;
}
.practice-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.prac-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}

.mtoggle{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.mtbtn{
  padding:4px 12px;font-size:10px;letter-spacing:1px;text-transform:uppercase;
  border:none;background:transparent;color:var(--dim);cursor:pointer;
  font-family:var(--sans);transition:all 0.15s;
}
.mtbtn.active{background:var(--gold);color:#111;font-weight:700}

/* Extremidades */
.limbs-wrapper{display:flex;flex-direction:column;align-items:center;gap:0}
.hands-row{display:flex;gap:12px;justify-content:center;margin-bottom:12px}
.foot-row{display:none;gap:12px;justify-content:center;margin-top:2px;margin-bottom:12px;border-top:1px dashed var(--border);padding-top:12px;width:100%;max-width:160px}
.foot-row.show{display:flex}

.hand-btn{
  width:58px;height:58px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:24px;font-weight:700;
  border:2px solid var(--border);background:var(--s2);color:var(--dim);
  transition:all 0.08s;
}
.hand-btn.lit-D{
  background:var(--blue-bg);border-color:var(--blue);color:var(--blue);
  box-shadow:0 0 18px rgba(126,184,200,0.25);transform:scale(1.08);
}
.hand-btn.lit-I{
  background:var(--red-bg);border-color:var(--red);color:var(--red);
  box-shadow:0 0 18px rgba(224,120,120,0.25);transform:scale(1.08);
}
.hand-btn.lit-K{
  background:var(--purple-bg);border-color:var(--purple);color:var(--purple);
  box-shadow:0 0 18px rgba(179,136,255,0.25);transform:scale(1.08);
}
.hand-btn.lit-H{
  background:var(--emerald-bg);border-color:var(--emerald);color:var(--emerald);
  box-shadow:0 0 18px rgba(128,203,116,0.25);transform:scale(1.08);
}
.hand-btn.grace-d{background:rgba(126,184,200,0.04);border-color:rgba(126,184,200,0.35);color:rgba(126,184,200,0.45);transform:scale(1.01)}
.hand-btn.grace-i{background:rgba(224,120,120,0.04);border-color:rgba(224,120,120,0.35);color:rgba(224,120,120,0.45);transform:scale(1.01)}

/* bpm controls */
.bpm-row{display:flex;align-items:center;gap:10px}
.bpm-slider{
  flex:1;-webkit-appearance:none;height:2px;
  background:var(--border);outline:none;cursor:pointer;border-radius:1px;
}
.bpm-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;
  border-radius:50%;background:var(--gold);cursor:pointer;
}
.play-btn{
  width:40px;height:40px;border-radius:50%;
  border:1.5px solid var(--gold);background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--gold);transition:all 0.15s;flex-shrink:0;
}
.play-btn:hover,.play-btn.on{background:var(--gold);color:#111}
.play-btn svg{fill:currentColor}

/* pulse dots */
.pulse-row{display:flex;gap:5px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--border);transition:background 0.05s}
.pdot.on{background:var(--gold)}

/* TRAIN MODE */
.train-block{display:none;flex-direction:column;gap:10px}
.train-block.show{display:flex}
.free-block{display:flex;flex-direction:column;gap:10px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tfield label{display:block;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.tfield input{
  width:100%;padding:6px 8px;
  font-family:var(--sans);font-size:14px;font-weight:300;
  background:var(--s2);border:1px solid var(--border);
  border-radius:4px;color:var(--text);outline:none;
  transition:border-color 0.15s;
}
.tfield input:focus{border-color:var(--gold)}
.train-status{font-size:11px;color:var(--muted);min-height:14px}
.train-status .hl{color:var(--gold);font-weight:700}
.train-controls{display:flex;align-items:center;gap:10px}
.prog-wrap{flex:1;height:2px;background:var(--border);border-radius:1px;overflow:hidden}
.prog-bar{height:100%;background:var(--gold);width:0%;transition:width 0.3s}

/* tip */
.tip{
  flex-shrink:0;
  padding:10px 12px;
  background:var(--s1);border:1px solid var(--border);
  border-left:3px solid var(--gold);border-radius:0 var(--r) var(--r) 0;
  font-size:12px;line-height:1.6;color:#bbb;font-weight:300;
}

/* ── MOBILE ── */
@media(max-width:580px){
  html,body{overflow:auto;height:auto}
  .body{grid-template-columns:1fr;overflow:visible}
  .rud-list{max-height:180px;border-right:none;border-bottom:1px solid var(--border)}
  .panel{overflow:visible}
  .hand-btn{width:52px;height:52px;font-size:20px}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Rudi<em>mental</em></div>
  <div class="bpm-header">
    <div class="bpm-num" id="hBpm">80</div>
    <div class="bpm-unit">BPM</div>
  </div>
</div>

<div class="tabs" id="tabsRow"></div>

<div class="body">
  <div class="rud-list" id="rudList"></div>

  <div class="panel">
    <div class="rud-header">
      <div class="rud-name" id="rudName">—</div>
      <div class="rud-sub">
        <span class="cat-pill" id="catPill"></span>
        <span id="rudNum"></span>
      </div>
    </div>

    <div class="seq-wrap">
      <div class="seq-label">Secuencia</div>
      <div class="seq-row" id="seqRow"></div>
    </div>

    <div class="practice">
      <div class="practice-top">
        <span class="prac-label">Práctica</span>
        <div class="mtoggle">
          <button class="mtbtn active" id="btnFree" onclick="setMode('free')">Libre</button>
          <button class="mtbtn" id="btnTrain" onclick="setMode('train')">Entrenamiento</button>
        </div>
      </div>

      <div class="limbs-wrapper">
        <div class="hands-row">
          <div class="hand-btn" id="handD">D</div>
          <div class="hand-btn" id="handI">I</div>
        </div>
        <div class="foot-row" id="footRow">
          <div class="hand-btn" id="handK">K</div>
          <div class="hand-btn" id="handH">H</div>
        </div>
      </div>

      <div class="free-block" id="freeBlock">
        <div class="bpm-row">
          <input type="range" class="bpm-slider" id="bpmSlider" min="30" max="240" value="80" oninput="setBpm(this.value)">
          <button class="play-btn" id="playBtn" onclick="togglePlay()">
            <svg id="playIco" width="14" height="14" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>
          </button>
        </div>
        <div class="pulse-row" id="pulseRow"></div>
      </div>

      <div class="train-block" id="trainBlock">
        <div class="tgrid">
          <div class="tfield"><label>Inicio BPM</label><input type="number" id="tStart" value="60" min="30" max="240"></div>
          <div class="tfield"><label>Objetivo BPM</label><input type="number" id="tTarget" value="120" min="30" max="240"></div>
          <div class="tfield"><label>Incremento</label><input type="number" id="tStep" value="5" min="1" max="20"></div>
          <div class="tfield"><label>Compases</label><input type="number" id="tBars" value="4" min="1" max="32"></div>
        </div>
        <div class="train-status" id="trainStatus">—</div>
        <div class="train-controls">
          <button class="play-btn" id="trainPlayBtn" onclick="toggleTrain()">
            <svg id="trainIco" width="14" height="14" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>
          </button>
          <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
        </div>
        <div class="pulse-row" id="trainPulseRow"></div>
      </div>
    </div>

    <div class="tip" id="tipBox"></div>
  </div>
</div>

<script>

  {id:2,cat:"Redobles",name:"Double Stroke Roll",seq:["D","D","I","I","D","D","I","I"],tip:"Dos golpes seguidos. Relajá la muñeca para el rebote natural."},
